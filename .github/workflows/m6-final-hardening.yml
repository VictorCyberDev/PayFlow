name: M6 Final Hardening

on:
  push:
    branches:
      - m6-delegated-human-not-present-commerce

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m6-delegated-human-not-present-commerce
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply reviewed M6 final hardening
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/paypal.ts')
          s = p.read_text()
          old = '/^[A-Za-z0-9_-]{1,64}$/.test(delegatedInstrument.vaultId)'
          new = '/^[A-Za-z0-9_-]{1,255}$/.test(delegatedInstrument.vaultId)'
          if old not in s:
              raise SystemExit('delegated vault validator pattern missing')
          s = s.replace(old, new, 1)
          marker = '\n/** M6 delegated (human-not-present) provider: Sandbox only, pre-approved instrument required. */\nexport function paypalDelegatedProviderFromEnv('
          i = s.find(marker)
          if i < 0:
              raise SystemExit('legacy delegated env helper missing')
          s = s[:i] + '\n'
          p.write_text(s)

          t = Path('tests/paypal-delegated.test.ts')
          x = t.read_text()
          x = x.replace('  paypalDelegatedProviderFromEnv,\n', '')
          x = x.replace('"x".repeat(65)', '"x".repeat(256)')
          start = x.find('  it("is Sandbox-only and requires an explicit instrument and credentials", () => {')
          if start < 0:
              raise SystemExit('legacy delegated env test missing')
          end = x.find('\n  });\n});', start)
          if end < 0:
              raise SystemExit('legacy delegated env test terminator missing')
          replacement = '''  it("accepts PayPal vault ids through 255 characters and rejects larger ids", () => {
            const { fetcher } = recorder();
            expect(
              () =>
                new PayPalPaymentProvider(
                  new PayPalOAuthClient("id", "secret", fetcher),
                  fetcher,
                  "sandbox",
                  undefined,
                  { vaultId: "A".repeat(255) },
                ),
            ).not.toThrow();
            expect(
              () =>
                new PayPalPaymentProvider(
                  new PayPalOAuthClient("id", "secret", fetcher),
                  fetcher,
                  "sandbox",
                  undefined,
                  { vaultId: "A".repeat(256) },
                ),
            ).toThrow("PAYPAL_DELEGATED_INSTRUMENT_INVALID");
          });
          it("delegated instruments remain Sandbox-only", () => {
            const { fetcher } = recorder();
            expect(
              () =>
                new PayPalPaymentProvider(
                  new PayPalOAuthClient("id", "secret", fetcher),
                  fetcher,
                  "live",
                  undefined,
                  { vaultId: "VAULT-1" },
                ),
            ).toThrow("PAYPAL_2D_SANDBOX_ONLY");
          });'''
          x = x[:start] + replacement + x[end + len('\n  });'):]
          t.write_text(x)
          PY
          npx prettier --write src/paypal.ts tests/paypal-delegated.test.ts
          npm run format:check
          npm run lint
          npm run typecheck
          npx vitest run tests/paypal-delegated.test.ts
          git diff --check
      - name: Commit reviewed hardening and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/m6-final-hardening.yml
          git config user.name "PayFlow M6 hardening"
          git config user.email "actions@users.noreply.github.com"
          git add src/paypal.ts tests/paypal-delegated.test.ts .github/workflows/m6-final-hardening.yml
          git commit -m "fix(m6): finalize stored-wallet PayPal boundary"
          git push origin HEAD:m6-delegated-human-not-present-commerce

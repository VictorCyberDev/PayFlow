name: Temporary 2C formatter
on:
  push:
    branches: [milestone-2-durable-paypal]
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, 'chore(2c): apply prettier') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatting
        run: |
          git config user.name "VictorCyberDev"
          git config user.email "victornnajiofor1@gmail.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(2c): apply prettier"
            git push
          fi

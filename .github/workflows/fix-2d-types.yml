name: Fix 2D Types
on:
  push:
    branches: [milestone-2-durable-paypal]
    paths: [.github/workflows/fix-2d-types.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: milestone-2-durable-paypal }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: |
          sed -i 's/private inflight?: Promise<string>;/private inflight: Promise<string> | undefined;/' src/paypal.ts
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/paypal.ts'); s=p.read_text()
          old='''    return {\n      id: p.id,\n      status: p.status,\n      payerActionUrl: p.links?.find(\n        (l) => l.rel === "payer-action" || l.rel === "approve",\n      )?.href,\n      captures,\n    };'''
          new='''    const payerActionUrl = p.links?.find(\n      (l) => l.rel === "payer-action" || l.rel === "approve",\n    )?.href;\n    return {\n      id: p.id,\n      status: p.status,\n      ...(payerActionUrl ? { payerActionUrl } : {}),\n      captures,\n    };'''
          if old not in s: raise SystemExit('expected PayPal order return block not found')
          p.write_text(s.replace(old,new))
          PY
      - run: npm run format
      - run: npm run typecheck
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/paypal.ts
          git commit -m "fix(2d): satisfy exact optional property types"
          git push origin HEAD:milestone-2-durable-paypal

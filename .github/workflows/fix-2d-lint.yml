name: Fix 2D Lint
on:
  push:
    branches: [milestone-2-durable-paypal]
    paths: [.github/workflows/fix-2d-lint.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-2-durable-paypal
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node .github/scripts/fix-2d-lint.mjs
      - run: npm run format
      - run: npm run lint
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/paypal.ts tests/paypal.integration.test.ts tests/paypal.test.ts
          git commit -m "fix(2d): satisfy strict lint rules"
          git push origin HEAD:milestone-2-durable-paypal
# corrected one-shot run

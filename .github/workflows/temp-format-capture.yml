name: Temporary formatting capture
on:
  pull_request:
permissions:
  contents: read
jobs:
  format-capture:
    if: github.head_ref == 'fix/guard-destructive-rehearsal-20261112'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Capture formatted reviewed files
        run: |
          npx prettier --write scripts/migration-rehearsal.mjs scripts/restore-rehearsal.mjs tests/disposable-db-guard.test.ts
          for file in scripts/migration-rehearsal.mjs scripts/restore-rehearsal.mjs tests/disposable-db-guard.test.ts; do
            printf 'FORMATTED_START:%s\n' "$file"
            base64 -w0 "$file"
            printf '\nFORMATTED_END:%s\n' "$file"
          done

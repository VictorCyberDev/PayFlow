name: Format Milestone 2D
on:
  push:
    branches: [milestone-2-durable-paypal]
    paths: [.github/workflows/format-2d.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milestone-2-durable-paypal
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src/paypal.ts tests/paypal.test.ts tests/paypal.integration.test.ts tests/paypal.sandbox.test.ts
          git diff --cached --quiet || git commit -m "style(2d): format PayPal milestone files"
          git push origin HEAD:milestone-2-durable-paypal
# one-shot formatter; final trigger after 2D docs

name: Format final M7-M60 gap closure

on:
  push:
    branches:
      - m7-m60-master-execution

permissions:
  contents: write

jobs:
  prettier:
    if: ${{ !contains(github.event.head_commit.message, '[formatted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m7-m60-master-execution
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format final gap-closure files
        run: |
          npx prettier --write \
            "src/network/pilots.ts" \
            "src/network/billing.ts" \
            "src/network/agent-credentials.ts" \
            "src/network/consumer-consent.ts" \
            "src/network/metrics.ts" \
            "src/network/secrets.ts" \
            "src/protocols/mcp-server.ts" \
            "src/protocols/a2a-server.ts" \
            "src/protocols/commerce-context.ts" \
            "tests/m12-m15-pilot-billing.test.ts" \
            "tests/m16-m18-server-handlers.test.ts" \
            "tests/m33-m58-gap-closure.test.ts" \
            "docs/MCP-A2A-SERVER.md"
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/network/pilots.ts src/network/billing.ts src/network/agent-credentials.ts src/network/consumer-consent.ts src/network/metrics.ts src/network/secrets.ts src/protocols/mcp-server.ts src/protocols/a2a-server.ts src/protocols/commerce-context.ts tests/m12-m15-pilot-billing.test.ts tests/m16-m18-server-handlers.test.ts tests/m33-m58-gap-closure.test.ts docs/MCP-A2A-SERVER.md
          git commit -m "chore: format final M7-M60 gap closure [formatted]"
          git push origin HEAD:m7-m60-master-execution

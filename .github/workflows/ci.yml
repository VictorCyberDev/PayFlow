name: PayFlow Fix Bootstrap
on:
  push:
    branches: [milestone-2-durable-paypal]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply strict persisted hash decoding
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/persistence.ts')
          s=p.read_text()
          s=s.replace('previousHash: r.previous_hash === null ? null : String(r.previous_hash),','previousHash: r.previous_hash === null ? null : typeof r.previous_hash === "string" ? r.previous_hash : (() => { throw new Error("MALFORMED_PERSISTED_EVIDENCE"); })(),')
          p.write_text(s)
          PY
          npm run format
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/persistence.ts
          git commit -m "fix: fail closed on malformed evidence hash"
          git push

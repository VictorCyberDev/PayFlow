name: Trust Kernel CI
on:
  pull_request:
  push:
    branches: [milestone-1-trust-kernel]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Apply deterministic repository repair
        if: github.event_name == 'push'
        run: |
          npm run format
          git add package-lock.json docs src tests eslint.config.js package.json tsconfig.json tsconfig.build.json vitest.config.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: format code and lock dependencies"
            git push origin HEAD:milestone-1-trust-kernel
          fi
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

name: Trust Kernel CI
on:
  pull_request:
  push:
    branches: [milestone-1-trust-kernel]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Capture generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-package-lock
          path: package-lock.json
      - name: Format working tree for verification
        run: npm run format
      - name: Capture formatter output
        uses: actions/upload-artifact@v4
        with:
          name: prettier-output
          path: |
            docs
            src
            tests
            eslint.config.js
            package.json
            tsconfig.json
            tsconfig.build.json
            vitest.config.ts
      - name: Verify committed formatting
        run: git diff --exit-code
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

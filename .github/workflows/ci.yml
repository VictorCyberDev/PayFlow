name: PayFlow Type Fix
on:
  push:
    branches: [milestone-2-durable-paypal]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply typed JSON adapter fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/persistence.ts')
          s=p.read_text().replace('${this.sql.json(r)},${r.evaluatedAt}', '${this.sql.json(r as unknown as never)},${r.evaluatedAt}')
          p.write_text(s)
          PY
          npm run format
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/persistence.ts
          git commit -m "fix: adapt Decision Receipt to PostgreSQL JSON type"
          git push

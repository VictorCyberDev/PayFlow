name: PayFlow Lockfile Commit
on:
  push:
    branches: [milestone-2-durable-paypal]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Restore final CI and commit lockfile
        shell: bash
        run: |
          cat > .github/workflows/ci.yml <<'YAML'
          name: PayFlow CI
          on:
            pull_request:
            push:
              branches: [milestone-2-durable-paypal]
          permissions:
            contents: read
          jobs:
            verify:
              runs-on: ubuntu-latest
              services:
                postgres:
                  image: postgres:17
                  env:
                    POSTGRES_USER: payflow
                    POSTGRES_PASSWORD: payflow_test
                    POSTGRES_DB: payflow_test
                  ports: ["5432:5432"]
                  options: >-
                    --health-cmd "pg_isready -U payflow -d payflow_test"
                    --health-interval 10s --health-timeout 5s --health-retries 5
              env:
                TEST_DATABASE_URL: postgres://payflow:payflow_test@localhost:5432/payflow_test
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: 20
                    cache: npm
                - run: npm ci
                - run: npm run format:check
                - run: npm run lint
                - run: npm run typecheck
                - run: npm test
                - run: npm run test:integration
                - run: npm run test:coverage
                - run: npm audit --omit=dev --audit-level=high
                - run: npm run build
          YAML
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json .github/workflows/ci.yml
          git commit -m "chore: lock PostgreSQL dependency and restore CI"
          git push

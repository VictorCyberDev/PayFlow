name: PayFlow Test Isolation Fix
on:
  push:
    branches: [milestone-2-durable-paypal]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Isolate integration schema
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/persistence.integration.test.ts')
          s=p.read_text().replace('repo = PostgresTrustRepository.connect(url!);','repo = PostgresTrustRepository.connect(url!);\n    await repo.sql`drop schema public cascade`;\n    await repo.sql`create schema public`;')
          p.write_text(s)
          PY
          npm run format
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/persistence.integration.test.ts
          git commit -m "test: isolate PostgreSQL integration schema"
          git push

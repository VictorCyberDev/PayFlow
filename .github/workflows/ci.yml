name: PayFlow CI
on:
  push:
    branches: [milestone-2-durable-paypal]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: npm run lint -- --fix
      - name: Commit safe formatting fixes
        run: |
          git config user.name "VictorCyberDev"
          git config user.email "victornnajiofor1@gmail.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(2c): format and lint fixes"
            git push
          fi

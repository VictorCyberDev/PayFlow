name: PayFlow CI
on:
  pull_request:
  push:
    branches:
      [
        milestone-2-durable-paypal,
        milestone-3-ai-intent,
        milestone-3f-foundation-closure,
        milestone-4-trusted-commerce,
      ]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: payflow
          POSTGRES_PASSWORD: payflow_test
          POSTGRES_DB: payflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U payflow -d payflow_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://payflow:payflow_test@localhost:5432/payflow_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run secret:scan
      - run: npm run evidence:check
      - name: Python SDK tests
        run: python3 -m unittest discover -s packages/sdk-python/tests -v
      - run: npm test -- --reporter=default --reporter=json --outputFile=/tmp/payflow-tests.json
      - run: npm run test:integration -- --reporter=default --reporter=json --outputFile=/tmp/payflow-integration.json
      - run: npm run test:coverage
      - name: Export bounded test counts
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const counts = path => {
            const r = JSON.parse(readFileSync(path, 'utf8'));
            return { total: r.numTotalTests, passed: r.numPassedTests, failed: r.numFailedTests, skipped: r.numPendingTests };
          };
          writeFileSync('coverage/review-results.json', JSON.stringify({ headSha: process.env.GITHUB_SHA, all: counts('/tmp/payflow-tests.json'), integration: counts('/tmp/payflow-integration.json') }));
          JS
      - name: Preserve bounded coverage metrics for independent review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-summary
          path: |
            coverage/coverage-summary.json
            coverage/review-results.json
          if-no-files-found: error
          retention-days: 7
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/console
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/console/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  console-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: payflow
          POSTGRES_PASSWORD: payflow_test
          POSTGRES_DB: payflow_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U payflow -d payflow_e2e"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      E2E_DATABASE_URL: postgres://payflow:payflow_test@localhost:5432/payflow_e2e
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/console/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: apps/console
      - run: npm run build
        working-directory: apps/console
      # The apt mirror has stalled on the runner (and a killed apt leaves its dpkg lock held), so
      # download the browser without system packages first, and only fall back to --with-deps.
      - name: Install Chromium (bounded retry)
        working-directory: apps/console
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            timeout 120 npx playwright-core install chromium && exit 0
            echo "Chromium download attempt $attempt failed"
          done
          timeout 300 npx playwright-core install --with-deps chromium
      - run: npm run test:e2e
        working-directory: apps/console

      - name: Company responsive and accessibility acceptance
        run: node scripts/company-browser-qa.mjs
        working-directory: .

name: M6 Format Probe

on:
  push:
    branches:
      - m6-delegated-human-not-present-commerce

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Print canonical Prettier output
        run: npx prettier src/paypal-vault-bootstrap.ts

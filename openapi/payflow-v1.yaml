openapi: 3.1.0
info:
  title: PayFlow Financial Authority API
  version: 1.0.0-preview
  description: >-
    Developer-preview API for bounded financial authority. Protocol and rail
    adapters never override Trust Kernel decisions. Verification is read-only.
servers:
  - url: http://localhost:3000
paths:
  /v1/authorities/{authorityId}:
    get:
      operationId: readAuthority
      summary: Read the bounded Authority visible to the authenticated agent.
      security: [{ bearerAuth: [authority:read] }]
      parameters:
        - in: path
          name: authorityId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Authority projection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthorityEnvelope" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/actions:
    post:
      operationId: requestAuthorizedAction
      summary: Ask the Trust Kernel whether an exact financial action may proceed.
      description: >-
        The caller does not provide a mandate fingerprint or merchant-risk truth.
        PayFlow loads Authority state and trusted context server-side. The
        `nonce` field is the replay/idempotency key: a second request with the
        same nonce is denied with `REPLAY_DETECTED` and never issues a second
        execution capability. A revoked or suspended Authority is refused with
        `AUTHORITY_INACTIVE` before the Trust Kernel runs.
      security: [{ bearerAuth: [action:request] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ActionRequest" }
      responses:
        "200":
          description: Deterministic ALLOW, DENY, or ESCALATE decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActionResult" }
        "400": { $ref: "#/components/responses/Malformed" }
        "403": { $ref: "#/components/responses/Denied" }
        "404": { $ref: "#/components/responses/NotFound" }
  /v1/verify/presentations:
    post:
      operationId: verifyAuthorityPresentation
      summary: Verify a signed Authority presentation without moving money.
      description: >-
        A verifier checks signature, audience, challenge, freshness, lifecycle,
        Authority binding and presentation replay. This endpoint has no execution capability.
      responses:
        "200": { description: Verification verdict }
  /v1/actions/execute:
    post:
      operationId: executeBoundedPurchase
      summary: Perform a bounded purchase through the one Authority path.
      description: >-
        Authenticated external-agent execution. The request is normalised into the same
        path every protocol uses: trusted quote, claimed-terms check, Trust Kernel, durable
        Reservation, one-time execution grant, Execution Boundary, payment rail,
        reconciliation, Proof. `amount` and `merchant` are untrusted assertions that are
        compared with the trusted price; they never grant anything.


        **Idempotency.** `nonce` is the replay key and is scoped to the Authority and agent.
        The first presentation wins. A repeat is answered with `REPLAY_DETECTED` and never
        causes a second provider effect. To retry the same logical request after a
        transport error, send the same `nonce` and read the Proof; to make a new request,
        use a new `nonce`.


        **Status semantics.** Policy outcomes (ALLOW, DENY, ESCALATE, UNRESOLVED) are
        HTTP 200 with a structured body. 400/401/403/404 mean the request was refused at
        the door and `effectCount` is 0. A 5xx means PayFlow cannot tell whether money
        moved: `effectCount` is `null`, never 0, and `doNotRetry` is true.


        **effectCount.** `1` = exactly one provider effect. `0` = PayFlow is certain no
        provider effect occurred. `null` = unknown; the operation is being reconciled and
        must not be retried.
      security: [{ credentialAuth: [action:request] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExecuteRequest" }
      responses:
        "200":
          description: A deterministic outcome. Switch on `status`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecuteOutcome" }
        "400":
          description: Malformed request. Nothing was stored. $0 moved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecuteRejection" }
        "401":
          description: Credential missing, unknown, expired or revoked. $0 moved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecuteRejection" }
        "403":
          description: Credential lacks scope, or is not bound to this agent or principal. $0 moved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecuteRejection" }
        "404":
          description: Authority not found for this credential. $0 moved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecuteRejection" }
        "500":
          description: Unexpected failure after acceptance. Effect unknown.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecuteUnknownFailure" }
  /v1/proofs/{proposalId}:
    get:
      operationId: readProof
      summary: Read the durable Proof for an operation owned by the calling agent.
      security: [{ credentialAuth: [proof:read] }]
      parameters:
        - in: path
          name: proposalId
          required: true
          schema: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Read-only Proof projection verified from durable records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProofEnvelope" }
        "401":
          description: Credential invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecuteRejection" }
        "403":
          description: Credential lacks the `proof:read` scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecuteRejection" }
        "404":
          description: No Proof for that id (also returned for another agent's operation)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecuteRejection" }
  /v1/proofs/{proposalId}/portable:
    get:
      operationId: readPortableProof
      summary: A signed, portable Proof that a separate party can verify offline.
      description: >-
        Signs a `payflow-proof/v1` from the already-verified operation trace. `outcome` is
        SUCCEEDED (`effectCount` 1), FAILED (0) or UNKNOWN (`null`, never 0). Verify it with the
        public key from `listPublicKeys` and `payflow-verify`; no PayFlow session is needed.
        Returns 409 until the outcome is verified.
      security: [{ credentialAuth: [proof:read] }]
      parameters:
        - in: path
          name: proposalId
          required: true
          schema: { type: string, maxLength: 128 }
      responses:
        "200":
          description: Signed portable Proof
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PortableProofEnvelope" }
        "401":
          description: Credential invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecuteRejection" }
        "403":
          description: Credential lacks the `proof:read` scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecuteRejection" }
        "404":
          description: No Proof for that id (also returned for another agent's operation)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecuteRejection" }
        "409":
          description: The outcome is not verified yet; no portable Proof can be signed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExecuteRejection" }
  /v1/keys:
    get:
      operationId: listPublicKeys
      summary: Public verification keys. Unauthenticated; they can verify, never sign.
      security: []
      responses:
        "200":
          description: Issuer and public JWKs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicKeys" }
  /v1/verify/proofs:
    post:
      operationId: verifyProof
      summary: Verify a signed PayFlow Proof. Anonymous, read-only, rate limited.
      description: >-
        Checks the signature of a portable Proof against the public keys this host publishes and reports what the Proof
        says, including whether money moved (`effectCount` is null when the outcome is UNKNOWN, never 0). Optional
        `expect` compares the Proof's signed facts with what the relying party expects and names each mismatch. Only the
        issuer this host publishes keys for is trusted; any other issuer is `UNKNOWN_ISSUER`. It reads no tenant data
        and writes nothing. Limited per address and globally; if the limiter is unavailable it answers 503 rather than
        verifying unmetered. Bodies over 16 KB are refused.
      x-hosted-only: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [proof]
              properties:
                proof: { type: object }
                expect:
                  type: object
                  additionalProperties: false
                  properties:
                    issuer: { type: string }
                    agentId: { type: string }
                    authorityId: { type: string }
                    amountMinor: { type: integer, minimum: 0 }
                    currency: { type: string, pattern: "^[A-Z]{3}$" }
                    merchantId: { type: string }
                maxAgeSeconds: { type: integer, minimum: 60, maximum: 31536000 }
      responses:
        "200":
          description: A verdict. `verified` is false for any Proof that is not authentic or does not match `expect`.
        "400": { description: The request is malformed; nothing was checked }
        "429": { description: Rate limited; see Retry-After }
        "503": { description: Rate limiting is unavailable; retry later }
  /v1/admin/org/authorities/{authorityId}/credentials:
    post:
      operationId: issuePortableCredential
      summary: Issue a portable Authority credential from a STORED Authority. Member API; needs authority:attest.
      description: >-
        The server reads the stored Authority (it must belong to the member's tenant and environment, be unrevoked, unexpired,
        have an enumerable merchant scope and an agent that is not suspended or retired) and signs a credential that says
        exactly what it allows: the stored agent, principal, currency, merchants and the autonomous per-action limit. The
        request can only NARROW (a smaller amount, a subset of merchants, an audience list, a shorter lifetime up to 24 h and
        never beyond the Authority's expiry). Currency, action kind, scope, subject and expiry cannot be supplied; unknown
        fields are refused. The same `idempotencyKey` and request return the same credential; a different request with that
        key is 409. Every issuance is written to the organization's audit trail. The response contains only public material.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - in: path
          name: authorityId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [holder, idempotencyKey]
              properties:
                holder:
                  type: object
                  additionalProperties: false
                  required: [kty, crv, x]
                  properties:
                    kty: { const: OKP }
                    crv: { const: Ed25519 }
                    x: { type: string }
                idempotencyKey: { type: string, minLength: 16, maxLength: 128 }
                audience:
                  {
                    type: array,
                    items: { type: string, format: uri },
                    minItems: 1,
                    maxItems: 10,
                  }
                counterpartyIds:
                  { type: array, items: { type: string }, minItems: 1 }
                maxAmountMinor: { type: integer, minimum: 1 }
                ttlSeconds: { type: integer, minimum: 60, maximum: 86400 }
                maxDepth: { type: integer, minimum: 0, maximum: 2 }
      responses:
        "201": { description: Issued }
        "200":
          { description: Idempotent replay of an earlier identical request }
        "400":
          { description: Malformed request or a field that may not be supplied }
        "403":
          {
            description: "Role not allowed, or a refusal such as AMOUNT_ABOVE_AUTHORITY, COUNTERPARTY_NOT_IN_AUTHORITY, AUTHORITY_REVOKED, AUTHORITY_EXPIRED, AGENT_NOT_ACTIVE, AUTHORITY_INTEGRITY_FAILED, MERCHANT_SCOPE_NOT_ENUMERABLE",
          }
        "404": { description: No such Authority in this tenant }
        "409": { description: IDEMPOTENCY_KEY_REUSED }
        "503": { description: This host has no credential issuer configured }
    get:
      operationId: listAuthorityCredentials
      summary: List credentials issued from one Authority.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - in: path
          name: authorityId
          required: true
          schema: { type: string }
      responses:
        "200":
          {
            description: Credentials with status ACTIVE,
            REVOKED,
            EXPIRED or AUTHORITY_REVOKED,
          }
  /v1/admin/org/credentials/{credentialId}/revoke:
    post:
      operationId: revokePortableCredential
      summary: Withdraw a portable credential. Idempotent; needs authority:attest_revoke.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - in: path
          name: credentialId
          required: true
          schema: { type: string }
      responses:
        "200":
          {
            description: Revoked (or already revoked); verifiers learn at their next status-list fetch,
          }
        "404": { description: No such credential in this tenant }
  /v1/admin/org/authorities/{authorityId}/delegations:
    post:
      operationId: createRootDelegation
      summary: Root a delegation chain in a STORED Authority. Needs authority:delegate.
      description: >-
        Scope comes from storage: action PURCHASE, the Authority's currency, merchants within its list, and a shared budget
        no larger than its cumulative limit. A request that names a currency, action kind or amount ceiling is rejected.
        Idempotent on `idempotencyKey`. Never bypasses the Trust Kernel: a delegation is only a constraint.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - in: path
          name: authorityId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [childAgentId, budgetMinor, idempotencyKey]
              properties:
                childAgentId: { type: string }
                budgetMinor: { type: integer, minimum: 1 }
                counterpartyIds:
                  { type: array, items: { type: string }, minItems: 1 }
                ttlSeconds: { type: integer, minimum: 60 }
                idempotencyKey: { type: string, minLength: 16, maxLength: 128 }
      responses:
        "201": { description: Created }
        "200": { description: Replay of an earlier identical request }
        "400": { description: Malformed or unknown field }
        "403":
          {
            description: Refused (budget above Authority,
            counterparty not in Authority,
            revoked Authority,
            role),
          }
        "404": { description: No such Authority in this tenant }
        "409": { description: Idempotency key reused with a different request }
    get:
      operationId: listDelegations
      summary: Delegations rooted in one Authority, with lineage and remaining budget. Needs view:authorities.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - in: path
          name: authorityId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Delegation views for this tenant only }
  /v1/admin/org/delegations/{delegationId}:
    get:
      operationId: inspectDelegation
      summary: A delegation with its parent/child lineage and its EFFECTIVE permissions (the intersection of every hop above it).
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - in: path
          name: delegationId
          required: true
          schema: { type: string }
      responses:
        "200": { description: The delegation view }
        "404":
          { description: No such delegation in this tenant and environment }
  /v1/admin/org/delegations/{delegationId}/hops:
    post:
      operationId: createDelegationHop
      summary: Extend a delegation on behalf of the organization. Narrowing only. Needs authority:delegate.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - in: path
          name: delegationId
          required: true
          schema: { type: string }
      responses:
        "201": { description: Created }
        "200": { description: Replay }
        "403": { description: Refused; a child can never widen its parent }
        "404": { description: No such delegation in this tenant }
  /v1/admin/org/delegations/{delegationId}/revoke:
    post:
      operationId: revokeDelegation
      summary: Revoke a delegation and, with it, everything beneath it. Idempotent. Needs authority:delegate_revoke.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - in: path
          name: delegationId
          required: true
          schema: { type: string }
      responses:
        "200": { description: Revoked; charges already reserved stay counted }
        "404": { description: No such delegation in this tenant }
  /v1/agent/delegations/{delegationId}/hops:
    post:
      operationId: agentCreateDelegationHop
      summary: The agent that HOLDS a delegation extends it to another agent. Narrowing only.
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - in: path
          name: delegationId
          required: true
          schema: { type: string }
      responses:
        "201": { description: Created }
        "401": { description: Agent credential required }
        "403":
          { description: Not the holder, or the hop would widen the parent }
        "423": { description: Organization paused }
  /v1/admin/org/missions:
    post:
      operationId: createMission
      summary: Create a mission (Mission Contract v1, `payflow-mission/v1`). Needs mission:create. Starts as DRAFT; nothing is in force until an owner approves.
      description: >-
        Money is integer minor units. Unknown fields at any depth are rejected, so authority cannot be smuggled in. Idempotent on `idempotencyKey`.
        A mission is a planning and permission boundary; it never moves money and is not a second Trust Kernel.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [contract, idempotencyKey]
              properties:
                contract: { type: object }
                idempotencyKey: { type: string, minLength: 16, maxLength: 128 }
      responses:
        "201": { description: Created }
        "200": { description: Replay of an identical request }
        "409": { description: Idempotency key reused with a different contract }
        "422":
          {
            description: Contract invalid (money,
            shape,
            unknown agent or capability,
            deadline in the past),
          }
    get:
      operationId: listMissions
      summary: List this tenant's missions. Needs view:missions. Cursor pagination (`after`), optional `status` and `limit`.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      responses:
        "200": { description: A page of missions and a `next` cursor }
  /v1/admin/org/missions/{missionId}:
    get:
      operationId: getMission
      summary: A mission with the contract in force, any proposal awaiting an owner, and why it needs one.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: The mission }
        "404": { description: No such mission in this tenant and environment }
  /v1/admin/org/missions/{missionId}/history:
    get:
      operationId: missionHistory
      summary: Append-only transitions and every contract version with its decision.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Transitions and versions }
  /v1/admin/org/missions/{missionId}/revisions:
    post:
      operationId: reviseMission
      summary: Revise a mission. Needs mission:revise. A revision that only narrows takes effect; anything wider waits for an owner.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "201": { description: Stored (applied, or proposed and waiting) }
        "409":
          {
            description: STALE_VERSION - `baseVersion` was not the newest version,
          }
  /v1/admin/org/missions/{missionId}/approve:
    post:
      operationId: approveMission
      summary: Put a pending version in force. Needs mission:approve (owner). Agents can never call this.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: The version is now in force }
        "409":
          {
            description: Nothing to approve,
            or `version` is not the pending one,
          }
  /v1/admin/org/missions/{missionId}/reject:
    post:
      operationId: rejectMissionVersion
      summary: Refuse a pending version. Needs mission:approve.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Rejected; the version in force is unchanged }
  /v1/admin/org/missions/{missionId}/{operation}:
    post:
      operationId: controlMission
      summary: "submit | resume | cancel | complete need mission:control; pause | revoke need mission:contain (SECURITY_ADMIN may contain, not release)."
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
        - {
            in: path,
            name: operation,
            required: true,
            schema:
              {
                type: string,
                enum: [submit, pause, resume, cancel, revoke, complete],
              },
          }
      responses:
        "200": { description: Transitioned }
        "409": { description: Illegal transition or mission already terminal }
  /v1/agent/missions:
    get:
      operationId: agentListMissions
      summary: Missions in force that this agent is assigned, showing only this agent's own capabilities.
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      responses:
        "200": { description: The agent's slice of its missions }
  /v1/agent/missions/{missionId}/revisions:
    post:
      operationId: agentProposeMissionRevision
      summary: An agent holding REQUEST_APPROVAL PROPOSES a revision. It always waits for an owner; `applied` is false.
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "202": { description: Proposal stored; nothing changed }
        "403": { description: The agent lacks REQUEST_APPROVAL on this mission }
  /v1/admin/org/missions/{missionId}/plans:
    post:
      operationId: createMissionPlan
      summary: Create a plan. Needs mission:plan. `source` TEMPLATE derives it from the contract alone; HUMAN supplies a draft. Active at once.
      description: >-
        A plan is validated whole or refused whole: cycles, unknown or self dependencies, duplicate keys, agents or capabilities the contract
        did not grant, unapproved provider types and deadlines past the mission are refused. An estimate is labelled and is never a quote.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "201": { description: Active }
        "422": { description: Plan invalid; `problems` lists why }
    get:
      operationId: getMissionPlan
      summary: The active plan with tasks, dependencies, readiness and progress (reconciled with the mission first), plus every plan version.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: The plan }
  /v1/admin/org/missions/{missionId}/plans/{planVersion}/{decision}:
    post:
      operationId: decideMissionPlan
      summary: Activate or reject a plan PROPOSED by an agent. Needs mission:plan. Revalidated against the contract in force at that moment.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
        - {
            in: path,
            name: planVersion,
            required: true,
            schema: { type: integer },
          }
        - {
            in: path,
            name: decision,
            required: true,
            schema: { type: string, enum: [activate, reject] },
          }
      responses:
        "200": { description: Decided }
        "409": { description: Not a proposed plan }
  /v1/admin/org/tasks/{taskId}/{operation}:
    post:
      operationId: memberTaskAction
      summary: "approve (mission:approve) | confirm-handoff | skip | invalidate | retry (mission:control). confirm-handoff records OWNER_REPORTED evidence."
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - { in: path, name: taskId, required: true, schema: { type: string } }
        - {
            in: path,
            name: operation,
            required: true,
            schema:
              {
                type: string,
                enum: [approve, confirm-handoff, skip, invalidate, retry],
              },
          }
      responses:
        "200": { description: Done }
  /v1/agent/tasks:
    get:
      operationId: agentListTasks
      summary: Tasks assigned to this agent on missions in force.
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      responses:
        "200": { description: The agent's tasks }
  /v1/agent/tasks/{taskId}/{operation}:
    post:
      operationId: agentTaskAction
      summary: "claim | complete | fail | handoff. Only the assigned agent, only while the mission is ACTIVE and the agent still holds every required capability. runKey makes retries replays."
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - { in: path, name: taskId, required: true, schema: { type: string } }
        - {
            in: path,
            name: operation,
            required: true,
            schema: { type: string, enum: [claim, complete, fail, handoff] },
          }
      responses:
        "200": { description: Done or replayed }
        "409": { description: Wrong state or another run holds the task }
        "422": { description: Required evidence missing }
  /v1/agent/missions/{missionId}/plans:
    post:
      operationId: agentProposeMissionPlan
      summary: An agent holding DRAFT proposes a plan labelled MODEL. It is inert until a member activates it.
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "202": { description: PROPOSED }
  /v1/admin/org/missions/{missionId}/ledger:
    get:
      operationId: missionLedger
      summary: The mission's authoritative financial view - ceiling, exposure by stage, available capacity, UNKNOWN and unverified exposure, and every item.
      description: >-
        Budget is spoken for from APPROVED through SETTLED (net of refunds) and while UNKNOWN. Estimates and quotes consume nothing.
        One item has one amount at a time, so an obligation is never counted twice as it moves from committed to reserved to settled.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Overview }
  /v1/admin/org/missions/{missionId}/ledger/items:
    post:
      operationId: createLedgerItem
      summary: Record an estimate, quote, approval, or an obligation committed outside PayFlow. Needs mission:ledger. Idempotent.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "201": { description: Created }
        "409":
          {
            description: Capacity exceeded,
            above the maximum commitment,
            mission not active,
            or illegal start stage,
          }
        "422": { description: Currency mismatch or insufficient evidence }
  /v1/admin/org/connectors:
    get:
      operationId: listConnectors
      summary: Connectors this host offers and their state for your organization. Credential references are never returned.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      responses:
        "200":
          {
            description: Connectors with status (NOT_INSTALLED,
            READY,
            DISABLED,
            SUSPENDED,
            NEEDS_CREDENTIAL,
            DEGRADED),
          }
  /v1/admin/org/connectors/{connectorId}/install:
    post:
      operationId: installConnector
      summary: Install and enable a connector after acknowledging what its data may be used for.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: connectorId,
            required: true,
            schema: { type: string },
          }
      responses:
        "201": { description: Installed }
        "200": { description: Already installed (replay) }
        "409":
          {
            description: Credential reference required,
            or a sandbox connector in production,
          }
  /v1/admin/org/connectors/{connectorId}/{action}:
    post:
      operationId: setConnectorState
      summary: Enable, disable (manage) or suspend (containment) an installed connector.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: connectorId,
            required: true,
            schema: { type: string },
          }
        - {
            in: path,
            name: action,
            required: true,
            schema: { type: string, enum: [enable, disable, suspend] },
          }
      responses:
        "200": { description: New state }
  /v1/admin/org/connector-calls:
    get:
      operationId: listConnectorCalls
      summary: Recent connector calls (outcome and counts only, never the data returned).
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      responses:
        "200": { description: Calls }
  /v1/agent/connectors:
    get:
      operationId: agentConnectors
      summary: What connectors exist and which are usable now.
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      responses:
        "200": { description: Connectors }
  /v1/agent/missions/{missionId}/connectors/invoke:
    post:
      operationId: agentObserve
      summary: Observe through a connector (SEARCH, READ, COMPARE, STATUS or VERIFY only). The result is an untrusted observation, never a quote or commitment.
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Observation (or the stored one, on replay) }
        "403":
          {
            description: Mission does not grant it,
            provider type not approved,
            or capability is not observe-only,
          }
        "409":
          {
            description: Connector not installed/disabled,
            or idempotency key reused,
          }
        "423": { description: Connector suspended or organization paused }
        "429":
          {
            description: Hourly allowance for this mission and connector used up,
          }
        "502":
          { description: Connector failed or returned something unsafe to show }
        "503": { description: Connector circuit open after repeated failures }
        "504": { description: Connector timed out }
  /v1/agent/missions/{missionId}/discovery/search:
    post:
      operationId: agentDiscover
      summary: Search through a connector (all connector gates apply) and keep what was observed as candidates, ranked against the stated requirements. Observations are never quotes.
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          { description: Ranked candidates (or the stored ones, on replay) }
        "403":
          {
            description: Mission does not grant SEARCH,
            or provider type not approved,
          }
        "409":
          {
            description: Connector not installed/disabled,
            or idempotency key reused,
          }
  /v1/agent/missions/{missionId}/candidates:
    get:
      operationId: agentCandidates
      summary: Candidates found for this mission, ranked against optional requirements given as query parameters (needs READ).
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          {
            description: Candidates with checks,
            marks and fit against the contract and ledger,
          }
  /v1/agent/missions/{missionId}/candidates/compare:
    post:
      operationId: agentCompareCandidates
      summary: Side-by-side of 2-5 candidates showing exactly what differs. No totals or landed cost (needs COMPARE).
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Comparison rows }
  /v1/agent/candidates/{candidateId}/mark:
    post:
      operationId: agentMarkCandidate
      summary: SHORTLIST, REJECT or CLEAR a candidate (append-only; the latest mark wins). A working note, not an approval (needs COMPARE).
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - {
            in: path,
            name: candidateId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Recorded or replayed }
        "409": { description: Idempotency key reused }
  /v1/admin/org/missions/{missionId}/candidates:
    get:
      operationId: listCandidates
      summary: The same candidate list for people.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Candidates }
  /v1/admin/org/missions/{missionId}/candidates/compare:
    post:
      operationId: compareCandidates
      summary: The same comparison for people.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Comparison rows }
  /v1/admin/org/candidates/{candidateId}/mark:
    post:
      operationId: markCandidate
      summary: A person's SHORTLIST, REJECT or CLEAR (needs the plan permission).
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: candidateId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Recorded or replayed }
  /v1/admin/org/missions/{missionId}/suppliers:
    get:
      operationId: listSuppliers
      summary: Suppliers with their computed qualification (QUALIFIED, NOT_QUALIFIED or INCOMPLETE) per required criterion. Qualified is not an approval to buy.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          {
            description: Suppliers,
            required criteria,
            criteria catalogue and notice,
          }
    post:
      operationId: addSupplier
      summary: Add a supplier by merchant reference, or from a discovered candidate that states a merchantId.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "201": { description: Added }
        "200": { description: Already present (replay) }
  /v1/admin/org/missions/{missionId}/qualification-policy:
    post:
      operationId: setQualificationPolicy
      summary: Set which criteria are required. The contract check is always included.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Policy in force }
  /v1/admin/org/suppliers/{supplierId}/facts:
    get:
      operationId: supplierFactHistory
      summary: Every fact ever recorded about the supplier, in order.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: supplierId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Facts }
    post:
      operationId: recordSupplierFact
      summary: Record a fact. A person may mark it VERIFIED with evidence acceptable for the criterion; the latest fact wins and nothing is erased.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: supplierId,
            required: true,
            schema: { type: string },
          }
      responses:
        "201": { description: Recorded }
        "403": { description: Evidence not acceptable for verification }
  /v1/agent/missions/{missionId}/suppliers:
    get:
      operationId: agentSuppliers
      summary: The same supplier view for an agent that can READ.
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Suppliers }
    post:
      operationId: agentAddSupplier
      summary: Add a supplier (needs READ).
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "201": { description: Added }
  /v1/agent/suppliers/{supplierId}/facts:
    post:
      operationId: agentRecordSupplierFact
      summary: Record a CLAIMED, UNKNOWN or FAILED fact (needs VERIFY). An agent cannot verify, attest, or weaken a person's verification.
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - {
            in: path,
            name: supplierId,
            required: true,
            schema: { type: string },
          }
      responses:
        "201": { description: Recorded }
        "403":
          {
            description: Verification,
            attestation or erasure by an agent refused,
          }
  /v1/admin/org/missions/{missionId}/quotes:
    get:
      operationId: listQuotes
      summary: Recorded supplier quotes with status (CURRENT, EXPIRED, SUPERSEDED) and landed cost. A total is shown only when nothing in it is unknown.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Quotes }
    post:
      operationId: recordQuote
      summary: Record what a supplier stated. Immutable; a newer quote supersedes an older one once.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "201": { description: Recorded }
        "403": { description: Supplier not allowed by the contract }
        "409": { description: Expired, superseded, or idempotency key reused }
  /v1/admin/org/missions/{missionId}/quotes/compare:
    post:
      operationId: compareQuotes
      summary: Rank complete, current quotes in the mission currency by landed cost; list the rest with the reason they were not ranked.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Ranking }
  /v1/admin/org/quotes/{quoteId}/ledger:
    post:
      operationId: quoteToLedger
      summary: Put a current, complete quote in the budget as one QUOTED item. Holds nothing until a person approves it.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - { in: path, name: quoteId, required: true, schema: { type: string } }
      responses:
        "201": { description: Created }
        "200": { description: Already in the budget (replay) }
        "422":
          {
            description: Quote incomplete,
            or currency differs from the mission,
          }
  /v1/agent/missions/{missionId}/quotes:
    get:
      operationId: agentQuotes
      summary: Quotes for the mission (needs READ).
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Quotes }
    post:
      operationId: agentRecordQuote
      summary: Record a supplier quote (needs COMPARE). An agent cannot report a quote as the owner's.
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "201": { description: Recorded }
  /v1/agent/missions/{missionId}/quotes/compare:
    post:
      operationId: agentCompareQuotes
      summary: Quote ranking by landed cost (needs COMPARE).
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Ranking }
  /v1/agent/quotes/{quoteId}/ledger:
    post:
      operationId: agentQuoteToLedger
      summary: Put a quote in the budget as one QUOTED item (needs COMPARE; ledger rules apply).
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - { in: path, name: quoteId, required: true, schema: { type: string } }
      responses:
        "201": { description: Created }
  /v1/admin/org/missions/{missionId}/sourcing/runs:
    get:
      operationId: listSourcingRuns
      summary: Recorded sourcing recommendations for the mission.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Runs }
    post:
      operationId: runSourcing
      summary: Choose the set of whole, usable quotes that covers a demand at the least landed cost. Exhaustive, so optimal for the recorded quotes only. Recommends; commits nothing.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "201": { description: Recorded (OPTIMAL, or INFEASIBLE with reasons) }
        "422":
          {
            description: More eligible quotes than can be searched exhaustively; narrow with quoteIds,
          }
  /v1/admin/org/sourcing/runs/{runId}:
    get:
      operationId: getSourcingRun
      summary: One run with its demand, constraints, snapshot of considered quotes and result.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - { in: path, name: runId, required: true, schema: { type: string } }
      responses:
        "200": { description: Run }
  /v1/admin/org/sourcing/runs/{runId}/adopt:
    post:
      operationId: adoptSourcingRun
      summary: Put the chosen quotes in the budget as QUOTED items (a person's act; idempotent).
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - { in: path, name: runId, required: true, schema: { type: string } }
      responses:
        "200": { description: Items, or the same items on replay }
        "409":
          {
            description: Run has no recommendation,
            or a chosen quote is no longer usable,
          }
  /v1/agent/missions/{missionId}/sourcing/runs:
    get:
      operationId: agentSourcingRuns
      summary: Sourcing runs for the mission (needs READ).
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Runs }
    post:
      operationId: agentRunSourcing
      summary: Ask for a sourcing recommendation (needs COMPARE). An agent cannot adopt one.
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "201": { description: Recorded }
  /v1/admin/org/missions/{missionId}/negotiations:
    get:
      operationId: listNegotiations
      summary: Negotiation rulebooks per supplier with status (IN_FORCE, WAITING_FOR_A_PERSON, EXPIRED, REVOKED, MISSION_NOT_ACTIVE) and every version.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Negotiations }
    post:
      operationId: proposeNegotiation
      summary: Propose rules for negotiating with a supplier. They wait for the owner. Nothing is sent to a supplier.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "201": { description: Proposed as a new version }
        "422":
          {
            description: The document breaks a limit of the mission,
            the budget or the grants,
          }
  /v1/admin/org/negotiations/{negotiationId}/versions/{version}/{decision}:
    post:
      operationId: decideNegotiationVersion
      summary: Owner approves or rejects a version. Approval re-checks the world (qualified supplier, budget, limits).
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: negotiationId,
            required: true,
            schema: { type: string },
          }
        - { in: path, name: version, required: true, schema: { type: integer } }
        - {
            in: path,
            name: decision,
            required: true,
            schema: { type: string, enum: [approve, reject] },
          }
      responses:
        "200": { description: Decided }
        "409": { description: Already decided, or the negotiation was revoked }
        "422": { description: Approval refused because the facts changed }
  /v1/admin/org/negotiations/{negotiationId}/revoke:
    post:
      operationId: revokeNegotiation
      summary: Withdraw the rules at once (containment). One way.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: negotiationId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Revoked (or already) }
  /v1/admin/org/negotiations/{negotiationId}/check:
    post:
      operationId: checkNegotiationMove
      summary: Dry-run a move against the rules in force. Returns ALLOW, REQUIRES_PERSON or REFUSE with reasons.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: negotiationId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Verdict }
  /v1/agent/missions/{missionId}/negotiations:
    get:
      operationId: agentNegotiations
      summary: Negotiation rulebooks for the mission (needs READ).
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Negotiations }
    post:
      operationId: agentProposeNegotiation
      summary: Propose rules for yourself (needs NEGOTIATE). An agent cannot write rules for another agent or approve any.
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "201": { description: Proposed }
  /v1/agent/negotiations/{negotiationId}/check:
    post:
      operationId: agentCheckNegotiationMove
      summary: Check a move against the rules in force now (only the named negotiator, needs NEGOTIATE).
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - {
            in: path,
            name: negotiationId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Verdict }
        "403":
          {
            description: Not the named negotiator,
            or the mission does not grant NEGOTIATE,
          }
  /v1/admin/org/missions/{missionId}/contacts:
    get:
      operationId: listSupplierContacts
      summary: Addresses a person registered for the mission's suppliers.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Contacts }
  /v1/admin/org/suppliers/{supplierId}/contacts:
    post:
      operationId: addSupplierContact
      summary: Register a plain email address for a supplier and say how it is known to be theirs. Agents cannot choose recipients.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: supplierId,
            required: true,
            schema: { type: string },
          }
      responses:
        "201": { description: Registered }
        "200": { description: Already registered }
  /v1/admin/org/contacts/{contactId}/{action}:
    post:
      operationId: setSupplierContactState
      summary: Block (containment) or restore a contact. A blocked contact can receive nothing.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: contactId,
            required: true,
            schema: { type: string },
          }
        - {
            in: path,
            name: action,
            required: true,
            schema: { type: string, enum: [block, restore] },
          }
      responses:
        "200": { description: Updated }
  /v1/admin/org/missions/{missionId}/messages:
    get:
      operationId: listMessages
      summary: Messages to and from suppliers with status. Inbound text is marked UNTRUSTED_SUPPLIER_TEXT.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Messages }
    post:
      operationId: draftMessage
      summary: Draft a message (always waits for a person). A counteroffer carries a move that must pass the negotiation rules.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "201": { description: Waiting for approval }
        "422":
          {
            description: The negotiation rules refuse the move,
            or the text reveals something it must not,
          }
  /v1/admin/org/missions/{missionId}/messages/inbound:
    post:
      operationId: recordInboundMessage
      summary: Record a supplier's reply as untrusted text. Triggers nothing.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "201": { description: Recorded }
  /v1/admin/org/messages/{messageId}/{action}:
    post:
      operationId: messageAction
      summary: approve / reject (a person's decision, re-checking the contact, mission and negotiation rules), send (once, only if approved), or resolve (settle a DELIVERY_UNKNOWN message).
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: messageId,
            required: true,
            schema: { type: string },
          }
        - {
            in: path,
            name: action,
            required: true,
            schema: { type: string, enum: [approve, reject, send, resolve] },
          }
      responses:
        "200": { description: Done }
        "409":
          {
            description: Illegal move,
            contact blocked,
            mission not active,
            or no channel available,
          }
        "422": { description: Rules or content check failed at this moment }
  /v1/admin/org/messages/{messageId}/events:
    get:
      operationId: messageEvents
      summary: Every status step of a message.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: messageId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Events }
  /v1/agent/missions/{missionId}/messages:
    get:
      operationId: agentMessages
      summary: Messages for the mission (needs READ).
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Messages }
    post:
      operationId: agentDraftMessage
      summary: Draft a message (needs DRAFT, or NEGOTIATE for a counteroffer). Nothing is sent.
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "201": { description: Waiting for approval }
  /v1/agent/messages/{messageId}/send:
    post:
      operationId: agentSendMessage
      summary: Send your own approved message (needs COMMUNICATE). Once; an unconfirmed delivery is DELIVERY_UNKNOWN and is never retried automatically.
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - {
            in: path,
            name: messageId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Status after the attempt }
  /v1/admin/org/negotiations/{negotiationId}/timeline:
    get:
      operationId: negotiationTimeline
      summary: Our counters (rounds counted by PayFlow) and the supplier's quotes in order, with a recommendation - review for acceptance, counter, wait, walk away or escalate. A recommendation only.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: negotiationId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Timeline and recommendation }
  /v1/agent/negotiations/{negotiationId}/timeline:
    get:
      operationId: agentNegotiationTimeline
      summary: The same for the named negotiator (needs NEGOTIATE).
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - {
            in: path,
            name: negotiationId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Timeline and recommendation }
        "403": { description: Not the named negotiator }
  /v1/admin/org/quotes/{quoteId}/acceptance-check:
    get:
      operationId: acceptanceCheck
      summary: Every check for accepting this quote, whether a person may, and whether an agent may on its own authority.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - { in: path, name: quoteId, required: true, schema: { type: string } }
      responses:
        "200": { description: Checks }
  /v1/admin/org/quotes/{quoteId}/accept:
    post:
      operationId: acceptQuote
      summary: Owner accepts a quote. Commits the budget inside PayFlow and concludes the negotiation; tells no one and pays no one. The walk-away cannot be exceeded; a missed term floor needs overrideReason.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - { in: path, name: quoteId, required: true, schema: { type: string } }
      responses:
        "201": { description: Accepted }
        "200": { description: Replay }
        "422":
          {
            description: A hard check failed,
            or an override reason is required,
          }
  /v1/admin/org/acceptances/{acceptanceId}/withdraw:
    post:
      operationId: withdrawAcceptance
      summary: Owner withdraws an acceptance. Releases the budget and reopens the negotiation; the quote itself is never accepted twice.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: acceptanceId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Withdrawn (or already) }
  /v1/admin/org/missions/{missionId}/acceptances:
    get:
      operationId: listAcceptances
      summary: Acceptances and escalations for the mission.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Acceptances and escalations }
  /v1/admin/org/escalations/{escalationId}/resolve:
    post:
      operationId: resolveEscalation
      summary: Owner resolves an agent's request - ACCEPT (accepts the quote, or ends the negotiation for a walk-away), DECLINE or DISMISS.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: escalationId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Resolved }
        "409": { description: Already resolved }
  /v1/agent/quotes/{quoteId}/acceptance-check:
    get:
      operationId: agentAcceptanceCheck
      summary: The same checks for an agent that can READ.
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - { in: path, name: quoteId, required: true, schema: { type: string } }
      responses:
        "200": { description: Checks }
  /v1/agent/quotes/{quoteId}/accept:
    post:
      operationId: agentAcceptQuote
      summary: Accept a quote (needs CONTRACT) only within the approved rules and the mission's permission; otherwise an escalation is raised for a person (outcome ESCALATED).
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - { in: path, name: quoteId, required: true, schema: { type: string } }
      responses:
        "201": { description: ACCEPTED or ESCALATED }
        "422":
          {
            description: A hard check failed; nothing is escalated because nothing could be accepted,
          }
  /v1/agent/missions/{missionId}/escalations:
    post:
      operationId: agentEscalate
      summary: Hand a decision to a person (needs NEGOTIATE) - ACCEPTANCE_REQUEST or WALK_AWAY_REQUEST. One open request per subject.
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "201": { description: Raised }
        "200": { description: Already waiting }
  /v1/agent/missions/{missionId}/acceptances:
    get:
      operationId: agentAcceptances
      summary: Acceptances and escalations (needs READ).
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Acceptances and escalations }
  /v1/admin/org/acceptances/{acceptanceId}/purchase-order:
    post:
      operationId: issuePurchaseOrder
      summary: Issue the purchase order for an accepted quote (owner, naming the PURCHASE agent). An instruction, not a payment; once per acceptance.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: acceptanceId,
            required: true,
            schema: { type: string },
          }
      responses:
        "201": { description: Issued }
        "200": { description: Replayed }
        "422":
          {
            description: No Authority,
            above the Authority,
            or merchant not in it,
          }
  /v1/admin/org/missions/{missionId}/purchase-orders:
    get:
      operationId: listPurchaseOrders
      summary: Purchase orders and their reconciliations for the mission.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Orders and reconciliations }
  /v1/admin/org/purchase-orders/{poId}/reconcile:
    post:
      operationId: reconcilePurchaseOrder
      summary: Compare a payment (by proposal id) to the order using PayFlow's own operation trace, and move the budget item with the evidence the ledger requires. Needs mission:ledger.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - { in: path, name: poId, required: true, schema: { type: string } }
      responses:
        "200": { description: Reconciled (or replayed) }
        "409": { description: PayFlow has no trace for that payment }
  /v1/agent/acceptances/{acceptanceId}/purchase-order:
    post:
      operationId: agentIssuePurchaseOrder
      summary: Issue the purchase order for an accepted quote (needs PURCHASE; the caller is the buyer).
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - {
            in: path,
            name: acceptanceId,
            required: true,
            schema: { type: string },
          }
      responses:
        "201": { description: Issued }
  /v1/agent/missions/{missionId}/purchase-orders:
    get:
      operationId: agentPurchaseOrders
      summary: Purchase orders and reconciliations (needs READ).
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Orders and reconciliations }
  /v1/agent/purchase-orders/{poId}/reconcile:
    post:
      operationId: agentReconcilePurchaseOrder
      summary: Reconcile your payment against the order (only the order's buyer; needs PURCHASE).
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - { in: path, name: poId, required: true, schema: { type: string } }
      responses:
        "200": { description: Reconciled (or replayed) }
  /v1/admin/org/purchase-orders/{poId}/order:
    post:
      operationId: createOrder
      summary: Create the order for a purchase PayFlow reconciled as settled. Once per purchase order.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - { in: path, name: poId, required: true, schema: { type: string } }
      responses:
        "201": { description: Created }
        "409": { description: Not settled, or already created }
  /v1/admin/org/missions/{missionId}/orders:
    get:
      operationId: listOrders
      summary: Orders for the mission, with verified status, unverified claims and lateness.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Orders }
  /v1/admin/org/orders/{orderId}/events:
    post:
      operationId: recordOrderEvent
      summary: Record an order event. With verify and evidence a person moves the status, reference or date; otherwise it is a claim.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - { in: path, name: orderId, required: true, schema: { type: string } }
      responses:
        "200": { description: Recorded }
        "409": { description: Illegal move }
        "422": { description: Evidence required }
  /v1/agent/purchase-orders/{poId}/order:
    post:
      operationId: agentCreateOrder
      summary: Create the order (only the purchase order's buyer; needs PURCHASE).
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - { in: path, name: poId, required: true, schema: { type: string } }
      responses:
        "201": { description: Created }
  /v1/agent/missions/{missionId}/orders:
    get:
      operationId: agentOrders
      summary: Orders (needs READ).
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Orders }
  /v1/agent/orders/{orderId}/events:
    post:
      operationId: agentRecordOrderEvent
      summary: Report something about an order. Always a claim; never moves the status.
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - { in: path, name: orderId, required: true, schema: { type: string } }
      responses:
        "200": { description: Recorded as a claim }
  /v1/admin/org/orders/{orderId}/fulfillment:
    get:
      operationId: orderFulfillment
      summary: Shipments, receipts, the computed outcome and the dispute grounds it supports.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - { in: path, name: orderId, required: true, schema: { type: string } }
      responses:
        "200": { description: Fulfillment }
  /v1/admin/org/orders/{orderId}/shipments:
    post:
      operationId: recordShipment
      summary: Record a shipment; with verify and evidence a person verifies it, otherwise it is a claim.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - { in: path, name: orderId, required: true, schema: { type: string } }
      responses:
        "201": { description: Recorded }
  /v1/admin/org/orders/{orderId}/receipts:
    post:
      operationId: recordReceipt
      summary: A person's count of what arrived for one purchase-order line, with condition and evidence. Only for an order verified as shipped.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - { in: path, name: orderId, required: true, schema: { type: string } }
      responses:
        "201": { description: Recorded }
        "409": { description: Order not verified as shipped }
  /v1/agent/orders/{orderId}/fulfillment:
    get:
      operationId: agentOrderFulfillment
      summary: Fulfillment view (needs READ).
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - { in: path, name: orderId, required: true, schema: { type: string } }
      responses:
        "200": { description: Fulfillment }
  /v1/agent/orders/{orderId}/shipments:
    post:
      operationId: agentReportShipment
      summary: Report a shipment for your order. Always a claim.
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - { in: path, name: orderId, required: true, schema: { type: string } }
      responses:
        "201": { description: Recorded as a claim }
  /v1/admin/org/ledger/items/{itemId}/transition:
    post:
      operationId: transitionLedgerItem
      summary: Move an item between stages (or apply a partial refund). Settled/refunded/failed/released need Proof or a provider confirmation; reservations and payment starts need an Authority receipt.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - { in: path, name: itemId, required: true, schema: { type: string } }
      responses:
        "200": { description: Moved or replayed }
        "409":
          {
            description: Illegal move,
            capacity,
            frozen amount or refund beyond what was settled,
          }
  /v1/admin/org/ledger/items/{itemId}/history:
    get:
      operationId: ledgerItemHistory
      summary: The append-only entries of one item.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - { in: path, name: itemId, required: true, schema: { type: string } }
      responses:
        "200": { description: Entries }
  /v1/agent/missions/{missionId}/ledger:
    get:
      operationId: agentMissionLedger
      summary: The capacity picture and only this agent's own items.
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Summary and own items }
  /v1/agent/missions/{missionId}/ledger/items:
    post:
      operationId: agentLedgerEstimate
      summary: An agent may only create ESTIMATED or QUOTED items.
      x-hosted-only: true
      security: [{ credentialAuth: [action:request] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "201": { description: Created }
        "403": { description: Not permitted for an agent }
  /v1/admin/org/missions/{missionId}/authorities:
    get:
      operationId: missionAuthorities
      summary: The stored Authorities compiled from an approved mission, and why any purchasing agent has none. Read-only.
      description: >-
        One Authority per (purchasing agent, spending category), never broader than the contract: merchants within the contract's ONLY list,
        maximum single transaction within the maximum commitment, cumulative limit within an even allocation of the budget less what earlier
        Authorities for the pair already used, the contract's deadline. Pausing, revoking, cancelling, completing, expiring or superseding the
        mission revokes them in the same transaction. Mission Contracts decide nothing; the Trust Kernel decides every purchase.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: missionId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200":
          {
            description: Compiled Authorities and the reasons others were not compiled,
          }
        "404": { description: No such mission in this tenant }
  /v1/issuer/directory:
    get:
      operationId: issuerDirectory
      summary: The issuer's signed key directory. Public.
      description: >-
        `payflow-issuer-directory/v1`: the issuer id (an origin), a monotonically increasing `sequence`, every key the issuer
        has published with its status (ACTIVE, RETIRED with an end of grace, or REVOKED as a tombstone), and the status-list
        URL. Valid for one hour. A published sequence is immutable and re-served byte for byte; a new sequence is cut only
        when the key set changes, the signing key changes, or the document nears expiry. Signed by the host's signing key.
        Verifiers must PIN the root key out of band, accept a new directory only if a key they already trust signed it, and
        refuse rollback or two different documents for one sequence (see `@payflow/directory-client`). If the signing key is
        unknown or revoked the endpoint answers 503 and publishes nothing.
      x-hosted-only: true
      security: []
      responses:
        "200": { description: Signed directory }
        "503": { description: DIRECTORY_UNAVAILABLE; nothing was published }
  /v1/issuer/status:
    get:
      operationId: issuerStatusList
      summary: The issuer's signed revocation list. Public.
      description: >-
        Lists credentials that were revoked, and credentials whose source Authority was revoked, until they would have
        expired. Signed by the issuer key published at /v1/keys; valid for 15 minutes. A verifier must authenticate it and
        treat a missing, forged or stale list as "unknown", not as "not revoked".
      x-hosted-only: true
      security: []
      responses:
        "200": { description: Signed status list }
  /v1/sandbox/start:
    post:
      operationId: startSandbox
      summary: Start a self-serve developer sandbox on the SIMULATED rail. No account.
      description: >-
        Creates an isolated sandbox tenant with its own agent, a $100 one-keyboard Authority and a
        one-hour credential. No payment provider is contacted and no money moves; every response
        and Proof is labelled SIMULATED. Rate limited per address; disabled unless the host enables it.
        The token is shown exactly once.
      x-hosted-only: true
      security: []
      responses:
        "201":
          description: Sandbox created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SandboxStarted" }
        "404": { description: Self-serve sandbox is not enabled on this host }
        "429":
          {
            description: Too many sandboxes started from this address; see Retry-After,
          }
  /v1/admin/sandbox/authority:
    post:
      operationId: provisionSampleAuthority
      summary: Operator-only. Provision a sample Authority for the real Sandbox rail.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      responses:
        "201": { description: Provisioned }
        "401": { description: Administrative authentication required }
  /v1/admin/org/agents:
    get:
      operationId: listOrgAgents
      summary: "Agent inventory: sponsor, lifecycle, active Authorities, exposure."
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      responses:
        "200":
          description: Tenant- and environment-scoped, read-only projection
          content:
            application/json:
              schema: { type: object }
        "401": { description: Administrative authentication required }
  /v1/admin/org/finance:
    get:
      operationId: orgFinanceHome
      summary: "Finance home: reserved, in flight, settled, available. Obligations beyond a reservation are NOT_MODELLED."
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      responses:
        "200":
          description: Tenant- and environment-scoped, read-only projection
          content:
            application/json:
              schema: { type: object }
        "401": { description: Administrative authentication required }
  /v1/admin/org/security:
    get:
      operationId: orgSecurityHome
      summary: "Security home: per-agent blast radius, delegation and recent denials."
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      responses:
        "200":
          description: Tenant- and environment-scoped, read-only projection
          content:
            application/json:
              schema: { type: object }
        "401": { description: Administrative authentication required }
  /v1/admin/org/authorities:
    get:
      operationId: listOrgAuthorities
      summary: Per-Authority exposure.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      responses:
        "200":
          description: Tenant- and environment-scoped, read-only projection
          content:
            application/json:
              schema: { type: object }
        "401": { description: Administrative authentication required }
  /v1/admin/org/decisions:
    get:
      operationId: listPendingDecisions
      summary: Escalations waiting for a human. The agent cannot reach this.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      responses:
        "200":
          description: Tenant- and environment-scoped, read-only projection
          content:
            application/json:
              schema: { type: object }
        "401": { description: Administrative authentication required }
  /v1/admin/org/unknown:
    get:
      operationId: listUnknownOperations
      summary: Unresolved payments. Observation only; nothing is re-executed.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      responses:
        "200":
          description: Tenant- and environment-scoped, read-only projection
          content:
            application/json:
              schema: { type: object }
        "401": { description: Administrative authentication required }
  /v1/admin/org/audit:
    get:
      operationId: listAuditEvents
      summary: Append-only audit trail. Identifiers and outcomes only.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      responses:
        "200":
          description: Tenant- and environment-scoped, read-only projection
          content:
            application/json:
              schema: { type: object }
        "401": { description: Administrative authentication required }
  /v1/admin/org/funnel:
    get:
      operationId: developerFunnel
      summary: Privacy-safe developer funnel from durable records; names what is not measured.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      responses:
        "200":
          description: Tenant- and environment-scoped, read-only projection
          content:
            application/json:
              schema: { type: object }
        "401": { description: Administrative authentication required }
  /v1/admin/decisions/{receiptId}/approve:
    post:
      operationId: approveDecision
      summary: Approve once. Reserves the Authority; does NOT pay.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: receiptId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Approved once }
        "401": { description: Administrative authentication required }
        "404":
          {
            description: No pending decision with that id (also for another tenant's),
          }
        "409": { description: The approval could not be recorded }
  /v1/admin/decisions/{receiptId}/reject:
    post:
      operationId: rejectDecision
      summary: Reject. Records an audit event; $0 moved.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - {
            in: path,
            name: receiptId,
            required: true,
            schema: { type: string },
          }
      responses:
        "200": { description: Rejected }
        "401": { description: Administrative authentication required }
        "404": { description: No pending decision with that id }
  /v1/admin/members:
    post:
      operationId: addMember
      summary: >-
        OWNER adds a member with a role (the token is shown once). The platform operator may instead
        bootstrap the FIRST OWNER of an existing organization.
      x-hosted-only: true
      security: [{ adminAuth: [] }, { operatorAuth: [] }]
      responses:
        "201":
          { description: Created. `token` is returned only in this response. }
        "400":
          {
            description: Malformed request,
            or the operator asked for something other than an OWNER,
          }
        "401": { description: Authentication required }
        "403": { description: The role does not allow this. Nothing changed. }
    get:
      operationId: listMembers
      summary: List members of the caller's organization and environment. Never returns secrets.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      responses:
        "200": { description: Member metadata }
        "401": { description: Authentication required }
        "403": { description: The role does not allow this }
  /v1/admin/members/{memberId}/revoke:
    post:
      operationId: revokeMember
      summary: OWNER revokes a member. The last active OWNER cannot be revoked.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      parameters:
        - in: path
          name: memberId
          required: true
          schema: { type: string, pattern: "^pfm_[a-f0-9]{24}$" }
      responses:
        "200": { description: Revoked }
        "401": { description: Authentication required }
        "403": { description: The role does not allow this }
        "404": { description: Not found in this organization and environment }
        "409": { description: Refused because it is the last active OWNER }
  /v1/admin/org/pause:
    post:
      operationId: pauseOrganization
      summary: OWNER or SECURITY_ADMIN stops NEW executions for the organization. Reads and Proof stay available.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      responses:
        "200": { description: Paused }
        "401": { description: Authentication required }
        "403": { description: The role does not allow this }
  /v1/admin/org/resume:
    post:
      operationId: resumeOrganization
      summary: Lift the organization pause. Cannot lift a GLOBAL or environment pause.
      x-hosted-only: true
      security: [{ adminAuth: [] }]
      responses:
        "200": { description: Resumed }
        "401": { description: Authentication required }
        "403": { description: The role does not allow this }
  /v1/admin/ops/reconciliation:
    get:
      operationId: reconciliationMetrics
      summary: Operator-only. UNKNOWN reconciliation backlog, oldest age, buckets, failure and resolution rates.
      x-hosted-only: true
      security: [{ operatorAuth: [] }]
      responses:
        "200": { description: Metrics }
        "401": { description: Authentication required }
        "403": { description: Platform operator only }
  /v1/admin/ops/reconcile/tick:
    post:
      operationId: reconcileTick
      summary: >-
        One OBSERVATION-ONLY reconciliation pass plus alert evaluation and alert delivery. Safe to repeat. The operator
        token may POST or GET it; a scheduler credential (`CRON_SECRET`, for example Vercel Cron) may call it by GET and
        nothing else.
      x-hosted-only: true
      security: [{ operatorAuth: [] }]
      responses:
        "200": { description: Tick summary }
        "401": { description: Authentication required }
        "403": { description: Platform operator only }
  /v1/admin/ops/alerts/test:
    post:
      operationId: sendSyntheticAlert
      summary: >-
        Operator-only. Raise a clearly labelled P2 SYNTHETIC_TEST alert, deliver it to the configured alert
        webhook, and resolve it at once. Proves the channel without creating incident history.
      x-hosted-only: true
      security: [{ operatorAuth: [] }]
      responses:
        "200": { description: Delivery summary }
        "401": { description: Authentication required }
        "403": { description: Platform operator only }
  /v1/admin/ops/alerts:
    get:
      operationId: listAlerts
      summary: Operator-only. Persisted operational alerts (P0 economic, P1 operational, P2 degraded).
      x-hosted-only: true
      security: [{ operatorAuth: [] }]
      responses:
        "200": { description: Alerts }
        "401": { description: Authentication required }
        "403": { description: Platform operator only }
  /v1/admin/credentials:
    post:
      operationId: issueCredential
      summary: Issue a scoped, expiring credential for an agent. The secret is shown once.
      security: [{ adminAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CredentialIssueRequest" }
      responses:
        "201":
          description: Issued. `token` is returned only in this response.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialIssued" }
        "400": { description: Malformed request or unknown agent }
        "401": { description: Administrative authentication required }
        "403": { description: The member role does not allow this }
    get:
      operationId: listCredentials
      summary: List credentials for the administrator's tenant and environment. Never returns secrets.
      security: [{ adminAuth: [] }]
      responses:
        "200":
          description: Credential metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CredentialList" }
        "401": { description: Administrative authentication required }
  /v1/admin/credentials/{credentialId}/revoke:
    post:
      operationId: revokeCredential
      summary: Revoke a credential. Idempotent. Takes effect on the next request.
      security: [{ adminAuth: [] }]
      parameters:
        - in: path
          name: credentialId
          required: true
          schema: { type: string, pattern: "^pfc_[a-f0-9]{24}$" }
      responses:
        "200": { description: Revoked }
        "401": { description: Administrative authentication required }
        "404": { description: Not found in this tenant and environment }
components:
  securitySchemes:
    credentialAuth:
      type: http
      scheme: bearer
      description: >-
        PayFlow developer-preview credential `pf_sbx_<id>.<secret>`, issued by
        `issueCredential`. Bound to one tenant, environment, agent and principal, with
        scopes, audience and expiry. OAuth/OIDC is the later production path.
    adminAuth:
      type: http
      scheme: bearer
      description: >-
        Organization MEMBER token `pf_act_<id>.<secret>`. The server decides what it may do from the
        member's stored role (OWNER, FINANCE_ADMIN, SECURITY_ADMIN, DEVELOPER, APPROVER, AUDITOR,
        VIEWER). It is bound to one organization and one environment. A role named in a header, query
        or body is ignored. The platform operator token is NOT a member and holds no role.
    operatorAuth:
      type: http
      scheme: bearer
      description: Platform operator secret. Bootstraps the first OWNER and runs platform operations only.
    bearerAuth:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /oauth/token
          scopes:
            authority:read: Read Authority projections.
            action:request: Request bounded financial actions.
            verify:read: Verify Authority or Proof material.
  schemas:
    Money:
      type: object
      additionalProperties: false
      required: [currency, minor]
      properties:
        currency: { type: string, pattern: "^[A-Z]{3}$" }
        minor: { type: integer, minimum: 0 }
    Merchant:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id: { type: string, minLength: 1 }
        displayName: { type: string, minLength: 1 }
    ActionRequest:
      type: object
      additionalProperties: false
      required:
        - mandateId
        - agentId
        - amount
        - merchant
        - category
        - condition
        - requestedCapability
        - proposedAt
        - nonce
      properties:
        requestId: { type: string }
        mandateId: { type: string }
        agentId: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        quantity: { type: integer, minimum: 1, maximum: 1000 }
        merchant: { $ref: "#/components/schemas/Merchant" }
        category: { type: string }
        condition: { type: string, enum: [NEW, REFURBISHED, USED] }
        requestedCapability:
          type: string
          enum:
            [
              SEARCH_PRODUCTS,
              EVALUATE_PRODUCTS,
              CREATE_ORDER,
              CAPTURE_PAYMENT,
              REQUEST_REFUND,
              CREATE_SUBSCRIPTION,
              OPEN_DISPUTE,
            ]
        proposedAt: { type: string, format: date-time }
        nonce: { type: string, minLength: 16 }
        metadata:
          type: object
          additionalProperties: { type: string }
    ExecuteRequest:
      type: object
      additionalProperties: false
      required: [authority, agentId, action, query, amount, merchant, nonce]
      properties:
        requestId: { type: string, minLength: 1, maxLength: 128 }
        authority:
          {
            type: string,
            minLength: 1,
            maxLength: 128,
            description: Authority id.,
          }
        agentId:
          {
            type: string,
            minLength: 1,
            maxLength: 128,
            description: Must equal the credential's agent.,
          }
        action: { type: string, const: purchase }
        query:
          type: object
          additionalProperties: false
          required: [text, quantity]
          properties:
            text: { type: string, minLength: 1, maxLength: 200 }
            quantity: { type: integer, minimum: 1, maximum: 1000 }
        amount:
          description: Claimed total in minor units. Verified against the trusted price.
          $ref: "#/components/schemas/Money"
        merchant:
          type: object
          additionalProperties: false
          required: [id]
          properties:
            id: { type: string, minLength: 1, maxLength: 128 }
        nonce: { type: string, minLength: 16, maxLength: 128 }
    ProofReference:
      type: object
      additionalProperties: false
      required: [proposalId]
      properties:
        proposalId: { type: [string, "null"] }
        href: { type: string, description: Path for readProof. }
        receiptId: { type: string }
        executionId: { type: string }
    ExecuteCompleted:
      type: object
      additionalProperties: false
      required:
        [
          requestId,
          decision,
          status,
          effectCount,
          recoverable,
          humanSummary,
          nextAction,
          proof,
        ]
      properties:
        rail:
          type: string
          enum: [SIMULATED, PAYPAL_SANDBOX]
          description: Which rail executes this Authority. SIMULATED moves no money. Never production.
        requestId: { type: string }
        decision: { type: string, const: ALLOW }
        status: { type: string, const: COMPLETED }
        effectCount: { type: integer, const: 1 }
        recoverable: { type: boolean, const: false }
        humanSummary: { type: string }
        nextAction: { type: string }
        proof: { $ref: "#/components/schemas/ProofReference" }
    ExecuteDenied:
      type: object
      additionalProperties: false
      required:
        [
          requestId,
          decision,
          status,
          effectCount,
          reason,
          recoverable,
          humanSummary,
          nextAction,
        ]
      properties:
        rail:
          type: string
          enum: [SIMULATED, PAYPAL_SANDBOX]
          description: Which rail executes this Authority. SIMULATED moves no money. Never production.
        requestId: { type: string }
        decision: { type: string, const: DENY }
        status: { type: string, const: DENIED }
        effectCount: { type: integer, const: 0 }
        reason: { type: string, pattern: "^[A-Z0-9_]+$" }
        recoverable: { type: boolean }
        humanSummary: { type: string }
        nextAction: { type: string }
        proof: { $ref: "#/components/schemas/ProofReference" }
    ExecuteNeedsApproval:
      type: object
      additionalProperties: false
      required:
        [
          requestId,
          decision,
          status,
          effectCount,
          reason,
          recoverable,
          humanSummary,
          nextAction,
          proof,
        ]
      properties:
        rail:
          type: string
          enum: [SIMULATED, PAYPAL_SANDBOX]
          description: Which rail executes this Authority. SIMULATED moves no money. Never production.
        requestId: { type: string }
        decision: { type: string, const: ESCALATE }
        status: { type: string, const: NEEDS_APPROVAL }
        effectCount: { type: integer, const: 0 }
        reason: { type: string }
        recoverable: { type: boolean }
        humanSummary: { type: string }
        nextAction: { type: string }
        proof: { $ref: "#/components/schemas/ProofReference" }
    ExecuteUnresolved:
      type: object
      additionalProperties: false
      required:
        [
          requestId,
          decision,
          status,
          effectCount,
          recoverable,
          doNotRetry,
          humanSummary,
          nextAction,
          proof,
        ]
      properties:
        rail:
          type: string
          enum: [SIMULATED, PAYPAL_SANDBOX]
          description: Which rail executes this Authority. SIMULATED moves no money. Never production.
        requestId: { type: string }
        decision: { type: string, const: ALLOW }
        status: { type: string, const: UNRESOLVED }
        effectCount:
          type: "null"
          description: Unknown. NEVER zero. PayFlow is confirming with the provider.
        reason: { type: string }
        recoverable: { type: boolean, const: false }
        doNotRetry: { type: boolean, const: true }
        humanSummary: { type: string }
        nextAction: { type: string }
        proof: { $ref: "#/components/schemas/ProofReference" }
    ExecuteOutcome:
      oneOf:
        - $ref: "#/components/schemas/ExecuteCompleted"
        - $ref: "#/components/schemas/ExecuteDenied"
        - $ref: "#/components/schemas/ExecuteNeedsApproval"
        - $ref: "#/components/schemas/ExecuteUnresolved"
    ExecuteRejection:
      type: object
      additionalProperties: true
      required: [requestId, reason]
      properties:
        requestId: { type: string }
        decision: { type: string, const: DENY }
        effectCount: { type: integer, const: 0 }
        reason: { type: string }
        recoverable: { type: boolean }
        humanSummary: { type: string }
        nextAction: { type: string }
    ExecuteUnknownFailure:
      type: object
      additionalProperties: false
      required:
        [
          requestId,
          decision,
          effectCount,
          reason,
          recoverable,
          doNotRetry,
          humanSummary,
          nextAction,
        ]
      properties:
        requestId: { type: string }
        decision: { type: string, const: DENY }
        effectCount: { type: "null" }
        reason: { type: string }
        recoverable: { type: boolean, const: false }
        doNotRetry: { type: boolean, const: true }
        humanSummary: { type: string }
        nextAction: { type: string }
    ProofEnvelope:
      type: object
      required: [requestId, proof]
      properties:
        requestId: { type: string }
        proof:
          {
            type: object,
            description: "Operation trace projection (payflow operation trace).",
          }
    CredentialIssueRequest:
      type: object
      additionalProperties: false
      required: [agentId, scopes, ttlSeconds]
      properties:
        agentId: { type: string }
        scopes:
          type: array
          minItems: 1
          items:
            {
              type: string,
              enum:
                [
                  authority:read,
                  action:request,
                  verify:read,
                  proof:read,
                  reconcile:request,
                ],
            }
        ttlSeconds: { type: integer, minimum: 60, maximum: 7776000 }
        label: { type: string, maxLength: 128 }
        audience: { type: string }
    Credential:
      type: object
      additionalProperties: false
      required:
        [
          credentialId,
          organizationId,
          environment,
          agentId,
          principalId,
          audience,
          scopes,
          label,
          status,
          issuedAt,
          expiresAt,
          revokedAt,
          lastUsedAt,
        ]
      properties:
        credentialId: { type: string, pattern: "^pfc_[a-f0-9]{24}$" }
        organizationId: { type: string }
        environment: { type: string, enum: [SANDBOX, PRODUCTION] }
        agentId: { type: string }
        principalId: { type: string }
        audience: { type: string }
        scopes: { type: array, items: { type: string } }
        label: { type: string }
        status: { type: string, enum: [ACTIVE, REVOKED] }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: [string, "null"] }
        lastUsedAt: { type: [string, "null"] }
    CredentialIssued:
      type: object
      additionalProperties: false
      required: [requestId, credential, token, notice]
      properties:
        requestId: { type: string }
        credential: { $ref: "#/components/schemas/Credential" }
        token:
          { type: string, description: Shown once. Never retrievable again. }
        notice: { type: string }
    CredentialList:
      type: object
      additionalProperties: false
      required: [requestId, credentials]
      properties:
        requestId: { type: string }
        credentials:
          type: array
          items: { $ref: "#/components/schemas/Credential" }
    PortableProof:
      type: object
      additionalProperties: false
      required:
        [
          version,
          issuer,
          keyId,
          authorityId,
          actionId,
          outcome,
          effectCount,
          observedAt,
          evidenceDigest,
          signature,
        ]
      properties:
        version: { type: string, const: payflow-proof/v1 }
        issuer: { type: string }
        keyId: { type: string }
        authorityId: { type: string }
        actionId: { type: string }
        outcome: { type: string, enum: [SUCCEEDED, FAILED, UNKNOWN] }
        effectCount:
          description: 1 for SUCCEEDED, 0 for FAILED, null for UNKNOWN (never 0).
          type: [integer, "null"]
          enum: [0, 1, null]
        observedAt: { type: string, format: date-time }
        evidenceDigest: { type: string, pattern: "^[a-f0-9]{64}$" }
        signature: { type: string }
    PortableProofEnvelope:
      type: object
      additionalProperties: false
      required: [requestId, proof]
      properties:
        requestId: { type: string }
        proof: { $ref: "#/components/schemas/PortableProof" }
    PublicKeys:
      type: object
      additionalProperties: false
      required: [requestId, issuer, keys]
      properties:
        requestId: { type: string }
        issuer: { type: string }
        keys:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [keyId, jwk]
            properties:
              keyId: { type: string }
              status:
                type: string
                enum: [ACTIVE, RETIRED]
                description: RETIRED keys still verify historical Proof. A revoked key is not listed.
              jwk: { type: object }
    SandboxStarted:
      type: object
      additionalProperties: false
      required: [requestId, sandbox, token, authority, next]
      properties:
        requestId: { type: string }
        sandbox:
          type: object
          additionalProperties: false
          required: [rail, notice, expiresAt]
          properties:
            rail: { type: string, const: SIMULATED }
            notice: { type: string }
            expiresAt: { type: string, format: date-time }
        token: { type: string, description: Shown once. }
        authority:
          type: object
          additionalProperties: false
          required:
            [
              id,
              agentId,
              limitMinor,
              currency,
              merchant,
              item,
              priceMinor,
              expiresAt,
            ]
          properties:
            id: { type: string }
            agentId: { type: string }
            limitMinor: { type: integer }
            currency: { type: string }
            merchant: { type: string }
            item: { type: string }
            priceMinor: { type: integer }
            expiresAt: { type: string, format: date-time }
        next:
          type: object
          additionalProperties: { type: string }
    Error:
      type: object
      additionalProperties: false
      required: [requestId, error]
      properties:
        requestId: { type: string }
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    AuthorityEnvelope:
      type: object
      required: [requestId, authority]
      properties:
        requestId: { type: string }
        authority:
          type: object
          required: [id, principalId, authorizedAgentId, status, fingerprint]
          properties:
            id: { type: string }
            principalId: { type: string }
            authorizedAgentId: { type: string }
            status:
              { type: string, enum: [ACTIVE, EXPIRED, SUSPENDED, REVOKED] }
            fingerprint: { type: string, pattern: "^[a-f0-9]{64}$" }
    ActionResult:
      type: object
      required: [requestId, decision]
      properties:
        requestId: { type: string }
        decision:
          type: object
          required: [decision, reasonCodes]
          properties:
            decision: { type: string, enum: [ALLOW, DENY, ESCALATE] }
            reasonCodes: { type: array, items: { type: string } }
        executionCapability:
          type: object
          description: Short-lived, one-time, action-bound capability. Never a payment credential.
          required: [grantId, expiresAt, proposalDigest]
          properties:
            grantId: { type: string }
            expiresAt: { type: string, format: date-time }
            proposalDigest: { type: string }
  responses:
    Malformed:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Denied:
      description: Authentication, scope, authority binding or lifecycle denied
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
